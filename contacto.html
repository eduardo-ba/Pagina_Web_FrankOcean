<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frank Ocean</title>
    <link rel="stylesheet" href="estilos/estilos.css">
</head>
<body>

    <header class="encabezado-frank"> 
        <div class="barra-contenido">
            <a href="index.html" class="logo">
                <h1>franksmind</h1>
            </a>
            <nav aria-label="Navegación principal del artista">
                <ul class="menu-navegacion">
                    <li><a href="discografia.html">Discografia</a></li>
                    <li><a href="biografia.html">Biografia</a></li>
                    <li><a href="contacto.html" aria-current="page">Contacto</a></li> 
                </ul>
            </nav>
        </div>
    </header>

<main class="contenido-principal">
    
    <h2 class="titulo-seccion">
      Contactanos
    </h2>

    <div class="contenedor-contacto"> 
        
        <section>
            
            <form class="formulario-frank" action="#" method="POST">
                
                <fieldset>
                    <legend class="ocultar-texto">Formulario de Contacto</legend>

                    <div class="campo-grupo">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre completo">
                    </div>

                    <div class="campo-grupo">
                        <label for="email">Correo:</label>
                        <input type="email" id="email" name="email" required placeholder="tu.correo@ejemplo.com">
                    </div>
                    
                    <div class="campo-grupo">
                        <label for="asunto">Asunto:</label>
                        <input type="text" id="asunto" name="asunto" required placeholder="Tema del mensaje">
                    </div>

                    <div class="campo-grupo">
                        <label for="mensaje">Mensaje:</label>
                        <textarea id="mensaje" name="mensaje" rows="6" placeholder="Escribe tu mensaje aquí"></textarea>
                    </div>

                    <button type="submit" class="btn-primary">
                        Enviar Mensaje
                    </button>
                </fieldset>
            </form>
        </section>
        
    </div>

</main>

    <footer>
        <p>Sitio dedicado a Frank Ocean</p>
        <p>Saludos a todos</p>
        <p>Luis Eduardo Barron Alvarez</p>
    </footer>
    
</body>
</html>
